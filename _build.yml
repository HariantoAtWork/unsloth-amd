# Local amd64 image for AMD Strix Halo / gfx1151 (ROCm). No multi-arch:
# ROCm apt + AMD gfx1151 wheels are linux/amd64 only.
services:
  unsloth-amd:
    build:
      context: build/unsloth-amd
      dockerfile: Dockerfile
    image: harianto/unsloth-amd:${UNSLOTH_TAG:-1.0.0-torch2.11.0-rocm7.13.0}

  # Alternate image without the gfx1151 torch pin (upstream Studio CMD).
  # unsloth-amd-latest:
  #   build:
  #     context: build/unsloth-amd
  #     dockerfile: Dockerfile.latest
  #   image: harianto/unsloth-amd:latest
