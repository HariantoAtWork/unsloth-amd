      dockerfile: Dockerfile
    image: harianto/unsloth-amd:${UNSLOTH_TAG:-1.0.0-torch2.10.0-rocm7.12.0}

  # Alternate image without the gfx1151 torch pin (upstream Studio CMD).
  # unsloth-amd-latest:
  #   build:
