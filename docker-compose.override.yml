# Cloudflare Tunnel for the docker services
networks:
  cloudflared:
    external: true
  tsdproxy:
    external: true

services:
  unsloth-amd:
    networks:
      - cloudflared
      - tsdproxy
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "unsloth-amd"
      tsdproxy.port.1: "443/https:8888/http"
  unsloth-planner:
    networks:
      - cloudflared
      - tsdproxy
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "unsloth-planner"
      tsdproxy.port.1: "443/https:8888/http"
  unsloth-builder:
    networks:
      - cloudflared
      - tsdproxy
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "unsloth-builder"
      tsdproxy.port.1: "443/https:8888/http"