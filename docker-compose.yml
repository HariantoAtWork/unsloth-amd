# Volume layout (sibling paths — no nested overlays on ~/.unsloth):
#   /opt/unsloth-install  shared Unsloth version (venv, llama.cpp, helper venvs)
#   /data/unsloth         per-service save data (auth, studio.db, runs, keys)
#   /root/.cache          shared download cache
#   /root/.local/share    shared uv/python tooling
# Entrypoint rebuilds ~/.unsloth as symlinks into install + data on every start.

services:
  unsloth-amd:
    container_name: unsloth-amd
    build: .
    image: harianto/unsloth-amd:${UNSLOTH_TAG:-1.0.0-torch2.10.0-rocm7.12.0}
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      # Shared Unsloth version (venv, llama.cpp, helper venvs, install markers)
      - unsloth-install:/opt/unsloth-install
      # This service only: auth, studio.db, runs/exports, API key, last model
      - unsloth-amd-data:/data/unsloth
      # Shared uv-managed Python / Unsloth launcher assets under ~/.local/share
      - unsloth-share:/root/.local/share
      # Shared HF / pip / uv download cache
      - unsloth-cache:/root/.cache
    shm_size: "2gb"
    stdin_open: true
    tty: true
    ports:
      - "${UNSLOTH_STUDIO_PORT:-8888}:${UNSLOTH_STUDIO_PORT:-8888}"
    environment:
      # Torch is +rocm7.12; bitsandbytes only ships up to rocm72 (and old bnb maps 7.12→82).
      BNB_ROCM_VERSION: "${BNB_ROCM_VERSION:-72}"
      UNSLOTH_STUDIO_HOST: "${UNSLOTH_STUDIO_HOST:-0.0.0.0}"
      UNSLOTH_STUDIO_PORT: "${UNSLOTH_STUDIO_PORT:-8888}"
      UNSLOTH_STUDIO_PASSWORD: "${UNSLOTH_STUDIO_PASSWORD:-}"
      UNSLOTH_API_KEY: "${UNSLOTH_API_KEY:-}"
      UNSLOTH_AUTOLOAD_LAST_MODEL: "${UNSLOTH_AUTOLOAD_LAST_MODEL:-1}"
      # UNSLOTH_INSTALL_ROOT / UNSLOTH_DATA_ROOT default to the mount paths below
    # Healthy once shared install + gfx1151 torch pin exist (so planner/builder can start).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -x /opt/unsloth-install/studio/unsloth_studio/bin/unsloth && test -f /opt/unsloth-install/.docker-install-complete && test -f /opt/unsloth-install/.docker-torch-pin-complete",
        ]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 45m
    restart: unless-stopped

  unsloth-planner:
    container_name: unsloth-planner
    image: harianto/unsloth-amd:${UNSLOTH_TAG:-1.0.0-torch2.10.0-rocm7.12.0}
    depends_on:
      unsloth-amd:
        condition: service_healthy
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      - unsloth-install:/opt/unsloth-install          # shared install (same as amd/builder)
      - unsloth-planner-data:/data/unsloth            # planner save data only
      - unsloth-share:/root/.local/share              # shared ~/.local/share
      - unsloth-cache:/root/.cache                    # shared download cache
    shm_size: "2gb"
    environment:
      UNSLOTH_STUDIO_PASSWORD: "Opti0n@l"
    restart: unless-stopped

  unsloth-builder:
    container_name: unsloth-builder
    image: harianto/unsloth-amd:${UNSLOTH_TAG:-1.0.0-torch2.10.0-rocm7.12.0}
    depends_on:
      unsloth-amd:
        condition: service_healthy
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      - unsloth-install:/opt/unsloth-install          # shared install (same as amd/planner)
      - unsloth-builder-data:/data/unsloth            # builder save data only
      - unsloth-share:/root/.local/share              # shared ~/.local/share
      - unsloth-cache:/root/.cache                    # shared download cache
    shm_size: "2gb"
    environment:
      UNSLOTH_STUDIO_PASSWORD: "Opti0n@l"
    restart: unless-stopped

# Named volumes (explicit `name:` keeps them stable across compose project renames).
volumes:
  # One Unsloth install for every service — do not put auth/db/runs here.
  unsloth-install:
    name: unsloth-install
  # Hugging Face / pip / uv caches shared by all services.
  unsloth-cache:
    name: unsloth-cache
  # Shared uv Python + launcher files under /root/.local/share.
  unsloth-share:
    name: unsloth-share
  # Per-service Studio state (isolated passwords, DB, last model, API keys).
  unsloth-amd-data:
    name: unsloth-amd-data
  unsloth-planner-data:
    name: unsloth-planner-data
  unsloth-builder-data:
    name: unsloth-builder-data
