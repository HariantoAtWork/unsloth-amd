services:
  unsloth-amd:
    build: .
    image: harianto/unsloth-amd:latest
    devices:
      - /dev/kfd
      - /dev/dri
    # Bind-mount the full DRM tree + KFD so rocminfo / install.sh see the GPU (devices: /dev/dri is a directory).
    volumes:
      - unsloth-home:/root/.unsloth
      - unsloth-local:/root/.local
      - unsloth-cache:/root/.cache
    shm_size: "2gb"
    stdin_open: true
    tty: true
    ports:
      - "${UNSLOTH_STUDIO_PORT:-8888}:${UNSLOTH_STUDIO_PORT:-8888}"
    environment:
      UNSLOTH_STUDIO_HOST: "0.0.0.0"
      UNSLOTH_STUDIO_PORT: "${UNSLOTH_STUDIO_PORT:-8888}"
    restart: unless-stopped

  unsloth-planner:
    image: harianto/unsloth-amd:latest
    volumes:
      - unsloth-planner-home:/root/.unsloth
      - unsloth-local:/root/.local
      - unsloth-cache:/root/.cache
    restart: unless-stopped

  unsloth-builder:
    image: harianto/unsloth-amd:latest
    volumes:
      - unsloth-builder-home:/root/.unsloth
      - unsloth-local:/root/.local
      - unsloth-cache:/root/.cache
    restart: unless-stopped



volumes:
  unsloth-cache:
    name: unsloth-cache
  # -- Main
  unsloth-home:
    name: unsloth-home
  unsloth-local:
    name: unsloth-local
  # -- Planner
  unsloth-planner-home:
    name: unsloth-planner-home
  unsloth-planner-local:
    name: unsloth-planner-local
  # -- Builder
  unsloth-builder-home:
    name: unsloth-builder-home
  unsloth-builder-local:
    name: unsloth-builder-local
